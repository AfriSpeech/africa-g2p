# Tests for every pull request and push to main.
#
# `native-parity` is what keeps the C library (native/) from drifting away from the
# Python package: it exports every language's tables from *this* commit and checks
# that the C engine produces byte-identical output to the Python converter. A change
# to the tables or to the Python conversion logic cannot pass unless native/ still
# matches it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests

  native-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe -> exact commit recorded in each data file
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Build the C library
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build -j
      - name: Export every language's tables from this commit
        run: python native/tools/export_tables.py --all
      - name: C output must equal Python output (universal + IPA, every language)
        run: python native/tests/parity.py --all --fuzz 200
      - name: Memory safety (AddressSanitizer + UBSan)
        run: |
          cmake -S native -B native/build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DAFRIG2P_BUILD_SHARED=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake --build native/build-asan -j
          python native/tests/make_fuzz.py 300 > /tmp/fuzz.txt
          for f in native/data/*.afg2p; do
            modes=universal
            grep -q "^ipa"$'\t'"1" "$f" && modes="universal ipa"
            for m in $modes; do
              native/build-asan/afrig2p -d "$f" -m "$m" -s " " < /tmp/fuzz.txt > /dev/null \
                || { echo "sanitizer failure: $f $m"; exit 1; }
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: afrig2p-data
          path: native/data/*.afg2p
          retention-days: 30
