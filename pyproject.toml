[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "africa-g2p"
version = "0.1.0"
description = "Rule-based grapheme-to-phoneme (G2P) conversion for African languages, based on Hartell's Alphabets of Africa (UNESCO, 1993)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Ghana NLP" }]
keywords = ["g2p", "phoneme", "ipa", "african-languages", "tts", "phonemizer"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Tools used only by the data/build scripts (not needed to use the library):
data = ["afriso", "huggingface_hub"]

[project.scripts]
africa-g2p = "africa_g2p.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/africa_g2p"]

[tool.hatch.build.targets.wheel.force-include]
"src/africa_g2p/languages" = "africa_g2p/languages"
"src/africa_g2p/data" = "africa_g2p/data"
